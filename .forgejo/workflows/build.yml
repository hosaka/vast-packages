name: Build and publish packages

on:
  push:
    branches:
      - main
    paths:
      - "srcpkgs/**"
  pull_request:
    paths:
      - "srcpkgs/**"
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild all packages. This WILL take ages!"
        type: boolean
        default: false

# publishing runs queue behind each other instead of being cancelled
# a new push to a pull request only cancels that PR's previous run
concurrency:
  group: ${{ forgejo.event_name == 'pull_request' && forgejo.ref || 'publish' }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: linux-amd64
    if: "!contains(forgejo.event.pull_request.title, '[ci skip]') && !contains(forgejo.event.pull_request.body, '[ci skip]')"

    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged --platform linux/amd64
      env:
        FORGEJO_URL: https://code.hosaka.cc
        VOID_PACKAGES_REPO: https://code.hosaka.cc/github/void-packages.git
        XBPS_MIRROR_URL: mirror.hosaka.cc/voidlinux
        XBPS_UPLOAD_TOKEN: ${{ secrets.XBPS_UPLOAD_TOKEN }}
        XBPS_VAST_PACKAGES_REPO: https://code.hosaka.cc/api/packages/hosaka/generic/vast-packages

    steps:
      - name: Prepare container
        run: |
          # switch to our own mirror (upstream uses a repo-ci.voidlinux.org instead)
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i "s|repo-default.voidlinux.org|$XBPS_MIRROR_URL|g" /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git jq nodejs xtools
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Checkout repository
        run: |
          git clone --no-checkout --filter=tree:0 "$FORGEJO_URL/$FORGEJO_REPOSITORY.git" .
          git config --global --add gc.auto 0
          git config --global --add safe.directory "$PWD"
          git fetch --prune --filter=tree:0 origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout "$FORGEJO_SHA"

      - name: Setup void-packages
        run: |
          git clone --depth=1 $VOID_PACKAGES_REPO
          git config --global --add safe.directory "$PWD/void-packages"
          cp -r srcpkgs/* void-packages/srcpkgs/

          # patch upstream void-packages common/
          for patch in common/*.patch; do
            [ -e "$patch" ] || continue
            # fails if a patch no longer applies until it gets fixed
            git -C void-packages apply --verbose "$PWD/$patch" || exit 1
          done

          chown -R builder:builder void-packages

      - name: Find changed packages
        id: changed
        run: |
          # restricted packages must not be redistributed
          drop_restricted() {
            while read -r pkg; do
              if grep -q '^restricted=yes' "srcpkgs/$pkg/template"; then
                echo "Skipping restricted package $pkg" >&2
              else
                echo "$pkg"
              fi
            done
          }

          if [ "${{ forgejo.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            echo "packages=$(ls srcpkgs/ | drop_restricted | tr '\n' ' ')" >> $FORGEJO_OUTPUT
            echo "deleted=" >> $FORGEJO_OUTPUT
            echo "Building all packages"
          else
            # build only packages whose template changed
            if [ "${{ forgejo.event_name }}" = "pull_request" ]; then
              base=$(git merge-base HEAD "origin/${{ forgejo.event.pull_request.base.ref }}")
            else
              # compare against the last commit this workflow published, not the previous tip
              runs=$(curl --silent --show-error --fail \
                "$FORGEJO_URL/api/v1/repos/$FORGEJO_REPOSITORY/actions/runs?event=push&event=workflow_dispatch&status=success&ref=${{ forgejo.ref }}&limit=50&page=1")
              last=$(echo "$runs" | jq --raw-output \
                '[.workflow_runs[] | select(.workflow_id == "build.yml")][0].commit_sha // empty')
              if [ -z "$last" ]; then
                echo "No successful run on ${{ forgejo.ref }} yet, run manually with 'all' to build every package" >&2
                exit 1
              fi
              # merge-base skips templates of commits that a force-push removed from the branch
              base=$(git merge-base "$last" "${{ forgejo.sha }}")
              echo "Last successful run was at $last, comparing against $base"
            fi

            packages=$(git diff-tree -r --no-renames --name-only --diff-filter=AM \
              "$base" "${{ forgejo.sha }}" -- 'srcpkgs/*/template' \
              | cut -d/ -f2 \
              | drop_restricted \
              | xargs --no-run-if-empty sudo -Eu builder ./void-packages/xbps-src sort-dependencies \
              | tr '\n' ' ')
            echo "packages=$packages" >> $FORGEJO_OUTPUT
            if [ -z "$packages" ]; then
              echo "No changed packages"
            else
              echo "Changed packages: $packages"
            fi

            deleted=$(git diff-tree -r --no-renames --name-only --diff-filter=D \
              "$base" "${{ forgejo.sha }}" -- 'srcpkgs/*/template' \
              | cut -d/ -f2 \
              | tr '\n' ' ')
            echo "deleted=$deleted" >> $FORGEJO_OUTPUT

            if [ -z "$deleted" ]; then
              echo "No deleted packages"
            else
              echo "Deleted packages: $deleted"
            fi
          fi

      - name: Lint changed packages
        if: steps.changed.outputs.packages != ''
        run: |
          cd void-packages
          for pkg in ${{ steps.changed.outputs.packages }}; do
            echo "Linting $pkg"
            sudo -Eu builder xlint $pkg
          done

      # a failed build should still leave its caches for the next run
      - name: Restore build caches
        if: steps.changed.outputs.packages != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            void-packages/hostdir/ccache
            void-packages/hostdir/cargo
            void-packages/hostdir/gocache-glibc
            void-packages/hostdir/sccache
            void-packages/hostdir/zig
          key: xbps-hostdir-${{ forgejo.run_id }}
          restore-keys: xbps-hostdir-

      - name: Prepare void-packages masterdir
        if: steps.changed.outputs.packages != ''
        run: |
          cd void-packages
          echo XBPS_ALLOW_RESTRICTED=no >> etc/conf
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_CCACHE=yes >> etc/conf
          echo XBPS_CHECK_PKGS=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uunshare >> etc/conf
          echo XBPS_MAKEJOBS=4 >> etc/conf
          echo XBPS_MIRROR=https://$XBPS_MIRROR_URL/current >> etc/conf
          # inject our repo and signing key into the xbps-src build chroot
          # this allows xbps-src to correctly find dependencies in vast-packages
          mkdir -p etc/xbps.d/custom etc/repo-keys
          echo "repository=$XBPS_VAST_PACKAGES_REPO/current" >> etc/xbps.d/custom/99-vast-packages.conf
          cp $FORGEJO_WORKSPACE/keys/*.plist etc/repo-keys/
          # ccache reads its config from the cache dir
          mkdir -p hostdir/ccache
          echo "max_size = 4G" > hostdir/ccache/ccache.conf
          chown -R builder:builder hostdir
          sudo -Eu builder ./xbps-src binary-bootstrap

      - name: Build packages
        if: steps.changed.outputs.packages != ''
        run: |
          # -1 fails instead of building missing dependencies from source, this happens
          # when the mirror has not caught up with void-packages repo, re-run once it syncs
          for pkg in ${{ steps.changed.outputs.packages }}; do
            echo "Building $pkg"
            rc=0
            sudo -Eu builder void-packages/xbps-src -1 -E -s pkg $pkg || rc=$?
            # SCCACHE_ERROR_LOG from common/sccache.patch, the sccache server itself is gone
            # with the build chroot, so count its log lines instead of asking it for stats
            log=void-packages/hostdir/sccache.log
            if [ -s "$log" ]; then
              echo "sccache: $(grep -c 'Cache hit in' "$log") hits, $(grep -c 'Cache miss in' "$log") misses"
              echo "::group::sccache log for $pkg"
              cat "$log"
              echo "::endgroup::"
              rm "$log"
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done

      - name: Save build caches
        if: "!cancelled() && steps.changed.outputs.packages != ''"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            void-packages/hostdir/ccache
            void-packages/hostdir/cargo
            void-packages/hostdir/gocache-glibc
            void-packages/hostdir/sccache
            void-packages/hostdir/zig
          key: xbps-hostdir-${{ forgejo.run_id }}

      - name: Sign and index packages
        if: steps.changed.outputs.packages != '' && forgejo.event_name != 'pull_request'
        run: |
          cd void-packages/hostdir/binpkgs

          # drop packages that are not ours, xbps-src builds dependencies from source
          # when the mirror has not caught up with void-packages git yet
          for pkg in *.xbps; do
            pkgname=$(xbps-uhelper getpkgname "$(xbps-uhelper binpkgver "$pkg")")
            if [ ! -e "$FORGEJO_WORKSPACE/srcpkgs/$pkgname" ]; then
              echo "Skipping $pkg (not in vast-packages)"
              rm "$pkg"
            fi
          done

          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/private.pem

          # sign newly built packages
          xbps-rindex --privkey /tmp/private.pem --signedby "Alex March" --sign-pkg *.xbps

          # replace local repodata with the existing one that contains all previously registered
          # packages, it may only be missing while the registry is still empty (first run)
          rm -f x86_64-repodata
          if ! $FORGEJO_WORKSPACE/scripts/forgejo.sh download x86_64-repodata; then
            packages=$($FORGEJO_WORKSPACE/scripts/forgejo.sh list)
            if [ -n "$packages" ]; then
              echo "Failed to download repodata of a non-empty registry" >&2
              exit 1
            fi
            echo "No existing repodata"
          fi

          # add newly built packages to the index (updates existing entries if version is greater)
          xbps-rindex --add *.xbps

          # sign the updated repodata
          xbps-rindex --privkey /tmp/private.pem --signedby "Alex March" --sign .
          rm /tmp/private.pem

      - name: Remove deleted packages
        if: steps.changed.outputs.deleted != '' && forgejo.event_name != 'pull_request'
        run: |
          packages=$(scripts/forgejo.sh list)
          for pkg in ${{ steps.changed.outputs.deleted }}; do
            for match in $(echo "$packages" | grep "^${pkg}-[^-]*_[0-9]*\."); do
              scripts/forgejo.sh delete "$match"
            done
          done

      - name: Remove old packages
        if: steps.changed.outputs.packages != '' && forgejo.event_name != 'pull_request'
        run: |
          packages=$(scripts/forgejo.sh list)

          # iterate over built packages so subpackages are covered too
          for pkg in void-packages/hostdir/binpkgs/*.xbps; do
            pkgname=$(xbps-uhelper getpkgname "$(xbps-uhelper binpkgver "$pkg")")
            for match in $(echo "$packages" | grep "^${pkgname}-[^-]*_[0-9]*\."); do
              scripts/forgejo.sh delete "$match"
            done
          done

      - name: Upload packages
        if: steps.changed.outputs.packages != '' && forgejo.event_name != 'pull_request'
        run: |
          for pkg in void-packages/hostdir/binpkgs/*{.xbps,.sig2}; do
            scripts/forgejo.sh upload "$pkg"
          done

      - name: Upload repodata
        if: steps.changed.outputs.packages != '' && forgejo.event_name != 'pull_request'
        run: |
          scripts/forgejo.sh delete x86_64-repodata
          scripts/forgejo.sh upload void-packages/hostdir/binpkgs/x86_64-repodata
          scripts/forgejo.sh link
